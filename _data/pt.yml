hero:
  name: "Luiz Henrique Targino"
  role: "Desenvolvedor Full-stack"
  location: "Parnamirim, RN, Brasil"
  bio: >
    Desenvolvedor de software com experiência em sistemas web, microserviços e,
    mais recentemente, streaming WebRTC de baixa latência. Atualmente trabalho
    em uma plataforma de streaming na Trybuchet (Birmingham, Inglaterra), onde
    desenvolvo um framework multimídia em Go cross-platform com captura nativa,
    encoding por hardware e pipeline de mídia em tempo real. Também tenho
    background sólido em Java/Spring, microserviços e desenvolvimento full-stack
    a partir de pesquisa aplicada na UFRN.

