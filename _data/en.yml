  role: "Full-stack Developer"
  location: "Parnamirim, RN, Brazil"
  bio: >
    Software developer with experience in web systems, microservices and, more
    recently, low-latency WebRTC streaming. I currently work on a streaming
    platform at Trybuchet (Birmingham, England), where I am building a
    cross-platform multimedia framework in Go featuring native capture,
    hardware-accelerated encoding and a real-time media pipeline. I also have
    a strong Java/Spring background, microservices and full-stack development
    from applied research at UFRN.

