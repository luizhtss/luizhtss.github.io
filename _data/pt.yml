experience:
  - company: "Trybuchet Ltd"
    role: "Desenvolvedor de Software"
    location: "Birmingham, Inglaterra"
    period: "Fevereiro 2026 — Presente"
    bullets:
      - "Atuação no desenvolvimento de uma plataforma de streaming WebRTC de baixa latência."
      - "Desenvolvimento individual de um framework multimídia em Go multiplataforma (Windows, Linux, macOS), incluindo captura nativa de tela e áudio (WASAPI, PulseAudio, CoreAudio), encoding de vídeo acelerado por hardware (NVIDIA Encoder, AMF, QSV, VAAPI, VideoToolbox), pipeline de mídia em tempo real e subsistema de injeção de input com gamepads virtuais."
      - "Programação de sistemas em Go, interoperabilidade com bibliotecas nativas via CGO e otimização de performance em hot path."
      - "Arquiteturas de streaming em tempo real: WebRTC, NACK, controle adaptativo de bitrate e fanout para múltiplos viewers; frontend em TypeScript/React."
    tech: ["Go", "CGO", "libavcodec", "WebRTC", "TypeScript", "React"]

