{%- assign lang = page.lang | default: "pt" -%}
{%- assign t = site.data[lang] -%}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.meta.title }}</title>
  <meta name="description" content="{{ t.meta.description }}">
  <meta property="og:title" content="{{ t.meta.title }}">
  <meta property="og:description" content="{{ t.meta.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="pt-BR" href="{{ '/' | absolute_url }}">
  <link rel="alternate" hreflang="en" href="{{ '/en/' | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
